server {
    listen 80;
    root /usr/share/nginx/html;

    # A location that sets any add_header drops every add_header inherited from
    # the server block, so each location includes the shared security headers.
    # (Cloudflare Pages uses public/_headers instead, which also sets a CSP.)

    # Client-side routes (/tendencies, /predict, ...) fall back to the app.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri /index.html;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
