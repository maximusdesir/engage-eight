name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; never give the job token write access.
permissions:
  contents: read

jobs:
  ml:
    name: ml tests (pandas ${{ matrix.pandas }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas: ["2.3.*", "3.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ml/requirements.txt "pandas==${{ matrix.pandas }}"
      - run: python -m pytest -q
        working-directory: ml

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r api/requirements.txt httpx
      - run: python smoke_test.py
        working-directory: api
      - name: Migrations match the models
        working-directory: api
        env:
          ENGAGE8_DEBUG: "true"
          ENGAGE8_DATABASE_URL: sqlite:///./ci-check.db
        run: alembic upgrade head && alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f api/Dockerfile -t engage-eight-api .
      - name: API image starts and serves a prediction
        run: |
          docker run -d --name api -p 8000:8000 \
            -e ENGAGE8_JWT_SECRET=ci-only-$(openssl rand -hex 16) \
            -e ENGAGE8_DATABASE_URL=sqlite:////tmp/ci.db engage-eight-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/auth/signup -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}'
          TOKEN=$(curl -sf -X POST localhost:8000/auth/login \
            -d 'username=ci@example.com&password=ci-password-123' | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          curl -sf -X POST localhost:8000/predict -H "Authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{"down":3,"distance":8,"yardline_100":45}'
      - name: API logs
        if: failure()
        run: docker logs api
      - name: Build web image
        run: docker build -t engage-eight-web web
