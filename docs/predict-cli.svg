<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" role="img" aria-label="Terminal: engage8.predict on 3rd and 8 from the 45 gives 97% pass from shotgun and 67% pass under center">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #e6edf3; white-space: pre; }
    .prompt { fill: #7ee787; }
    .dim { fill: #8b949e; }
    .pass { fill: #ffa657; font-weight: bold; }
  </style>
  <rect width="760" height="268" rx="10" fill="#0d1117"/>
  <rect width="760" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="760" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>

  <text x="20" y="64" xml:space="preserve"><tspan class="prompt">$</tspan> python -m engage8.predict --down 3 --distance 8 --yardline 45 --shotgun</text>
  <text x="20" y="88" xml:space="preserve">  Pass: <tspan class="pass">97%</tspan>   Run: 3%</text>
  <text x="20" y="110" xml:space="preserve">  Lean: <tspan class="pass">PASS</tspan>  (confidence 97%)</text>
  <text x="20" y="132" xml:space="preserve" class="dim">  Why:  3rd &amp; 8, obvious passing down, shotgun: 97% pass.</text>

  <text x="20" y="176" xml:space="preserve"><tspan class="prompt">$</tspan> python -m engage8.predict --down 3 --distance 8 --yardline 45 --under-center</text>
  <text x="20" y="200" xml:space="preserve">  Pass: <tspan class="pass">67%</tspan>   Run: 33%</text>
  <text x="20" y="222" xml:space="preserve">  Lean: <tspan class="pass">PASS</tspan>  (confidence 67%)</text>
  <text x="20" y="244" xml:space="preserve" class="dim">  Why:  3rd &amp; 8, obvious passing down, under center: 67% pass.</text>
</svg>
