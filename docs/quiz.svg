<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="The Call it quiz in black, white and red. Left: 3rd and 6 at own 26, fourth quarter, leading by 14, under center, with a black Run button and a red Pass button. Right: the reveal. It was a run, the player guessed pass and was wrong, and the model gave 76% run.">
  <style>
    text { font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #0a0a0a; white-space: pre; }
    .logo { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; }
    .cap { font-size: 9px; font-weight: 600; letter-spacing: 1.3px; fill: #6b6b6b; }
    .num { font-size: 24px; font-weight: 800; }
    .of { font-size: 12px; font-weight: 500; fill: #6b6b6b; }
    .huge { font-size: 58px; font-weight: 800; letter-spacing: -2.6px; }
    .at { font-size: 15px; font-weight: 600; letter-spacing: 1px; fill: #6b6b6b; }
    .val { font-size: 14px; font-weight: 700; }
    .gray { fill: #6b6b6b; }
    .btn { font-size: 18px; font-weight: 800; letter-spacing: 1.2px; fill: #ffffff; }
    .kbd { font-size: 9px; font-weight: 600; letter-spacing: 0.5px; fill: #ffffff; opacity: 0.65; }
    .call { font-size: 88px; font-weight: 800; letter-spacing: -4.5px; }
    .small { font-size: 11px; }
    .lab { font-size: 10px; font-weight: 800; letter-spacing: 1px; }
  </style>

  <!-- ===== Left: the question ===== -->
  <rect x="0.5" y="0.5" width="369" height="399" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="20" y="32" class="logo">ENGAGE EIGHT</text>
  <text x="350" y="32" text-anchor="end" class="small" style="text-decoration: underline">Sign in</text>
  <rect x="20" y="40" width="330" height="3" fill="#0a0a0a"/>

  <text x="20" y="64" class="cap">YOU</text>
  <text x="20" y="88" class="num">4<tspan class="of">/6</tspan></text>
  <text x="185" y="86" text-anchor="middle" class="cap">PLAY 7 OF 10</text>
  <text x="350" y="64" text-anchor="end" class="cap">MODEL</text>
  <text x="350" y="88" text-anchor="end" class="num">5<tspan class="of">/6</tspan></text>
  <rect x="20" y="100" width="330" height="1" fill="#d9d9d9"/>

  <text x="18" y="164" class="huge">3rd &amp; 6</text>
  <text x="20" y="190" class="at">AT OWN 26</text>

  <rect x="20" y="206" width="155" height="1" fill="#0a0a0a"/>
  <text x="20" y="220" class="cap">CLOCK</text>
  <text x="20" y="238" class="val">Q4 3:36</text>
  <rect x="195" y="206" width="155" height="1" fill="#0a0a0a"/>
  <text x="195" y="220" class="cap">SCORE</text>
  <text x="195" y="238" class="val">Leading by 14</text>
  <rect x="20" y="252" width="155" height="1" fill="#0a0a0a"/>
  <text x="20" y="266" class="cap">TIMEOUTS</text>
  <text x="20" y="284" class="val">2</text>
  <rect x="195" y="252" width="155" height="1" fill="#0a0a0a"/>
  <text x="195" y="266" class="cap">ALIGNMENT</text>
  <text x="195" y="284" class="val">Under center</text>
  <text x="20" y="312" class="small gray">ATL offense vs CAR, week 1</text>

  <rect x="20" y="328" width="159" height="54" fill="#0a0a0a"/>
  <text x="99.500" y="362" text-anchor="middle" class="btn">RUN <tspan class="kbd">R</tspan></text>
  <rect x="191" y="328" width="159" height="54" fill="#e10600"/>
  <text x="270.500" y="362" text-anchor="middle" class="btn">PASS <tspan class="kbd">P</tspan></text>

  <!-- ===== Right: the reveal ===== -->
  <g transform="translate(390 0)">
    <rect x="0.5" y="0.5" width="369" height="399" fill="#ffffff" stroke="#c9c9c9"/>
    <text x="20" y="32" class="logo">ENGAGE EIGHT</text>
    <text x="350" y="32" text-anchor="end" class="small" style="text-decoration: underline">Sign in</text>
    <rect x="20" y="40" width="330" height="3" fill="#0a0a0a"/>

    <text x="20" y="64" class="cap">YOU</text>
    <text x="20" y="88" class="num">4<tspan class="of">/7</tspan></text>
    <text x="185" y="86" text-anchor="middle" class="cap">PLAY 7 OF 10</text>
    <text x="350" y="64" text-anchor="end" class="cap">MODEL</text>
    <text x="350" y="88" text-anchor="end" class="num">6<tspan class="of">/7</tspan></text>
    <rect x="20" y="100" width="330" height="1" fill="#d9d9d9"/>

    <text x="20" y="128" class="at" style="font-size:12px">3rd &amp; 6 · AT OWN 26</text>
    <rect x="20" y="140" width="330" height="3" fill="#0a0a0a"/>

    <rect x="21" y="156" width="64" height="22" fill="#ffffff" stroke="#6b6b6b" stroke-width="2"/>
    <text x="53" y="171" text-anchor="middle" class="lab gray">WRONG</text>
    <rect x="29" y="166.500" width="48" height="1.500" fill="#6b6b6b"/>
    <text x="96" y="172" style="font-weight:600;font-size:14px">You said pass.</text>

    <text x="17" y="258" class="call">RUN.</text>

    <text x="20" y="288" style="font-size:13px">(3:36) 25-T.Allgeier left tackle to ATL 26</text>
    <text x="20" y="306" style="font-size:13px">for no gain (7-S.Thompson).</text>

    <rect x="20" y="322" width="251" height="14" fill="#0a0a0a"/>
    <rect x="271" y="322" width="79" height="14" fill="#e10600"/>
    <text x="20" y="352" class="lab">RUN 76%</text>
    <text x="350" y="352" text-anchor="end" class="lab">PASS 24%</text>
    <text x="20" y="376" class="small gray">The model said run and was right.</text>
  </g>
</svg>
